<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>설문 만들기</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --surface: #fcfcfb;
    --surface-2: #f1f1ef;
    --text: #0b0b0b;
    --text-2: #52514e;
    --line: #d7d7d2;
    --accent: #1a4fa0;
    --on-accent: #ffffff;
    --warn-bg: #fff3d1;
    --warn-text: #3d2600;
    --ok-bg: #e3f1e6;
    --ok-text: #0f3d1c;
    --danger: #b3261e;
    --on-danger: #ffffff;
    --focus: #c2410c;
    --series: #2a78d6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #1a1a19; --surface-2: #242423; --text: #ffffff; --text-2: #c3c2b7; --line: #3a3a38;
      --accent: #8db4ff; --on-accent: #0b0b0b; --warn-bg: #3a2a00; --warn-text: #ffe08a;
      --ok-bg: #16331d; --ok-text: #c4ecce; --danger: #ffb4ab; --on-danger: #3a0906; --focus: #ffb36b;
      --series: #3987e5;
      color-scheme: dark;
    }
  }

  html { font-size: 18px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--surface); color: var(--text);
    font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.55; word-break: keep-all; overflow-wrap: anywhere;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  main { max-width: 52rem; margin: 0 auto; padding: 16px 16px 64px; }
  h1 { font-size: 1.5rem; margin: 0.4rem 0 0.2rem; }
  h2 { font-size: 1.15rem; margin: 0; }
  .sub { margin: 0 0 1rem; color: var(--text-2); }

  .btn {
    font: inherit; font-weight: 700; min-height: 46px; padding: 0.4rem 1rem; border-radius: 10px;
    border: 2px solid var(--accent); background: var(--surface); color: var(--accent); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.plain { border-color: var(--line); color: var(--text); }
  .btn.danger-line { border-color: var(--danger); color: var(--danger); }
  .btn.small { min-height: 38px; padding: 0.2rem 0.7rem; font-size: 0.9rem; }
  .btn[disabled] { opacity: 0.5; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row.end { justify-content: flex-end; }

  .notice { margin: 0.8rem 0; padding: 0.6rem 0.9rem; border-radius: 10px; background: var(--warn-bg); color: var(--warn-text); font-weight: 700; }
  .notice.ok { background: var(--ok-bg); color: var(--ok-text); }
  .notice[hidden] { display: none; }
  .hint { color: var(--text-2); font-size: 0.9rem; }

  .card { margin: 0.8rem 0; padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
  .card .meta { margin: 0.2rem 0 0.6rem; color: var(--text-2); font-size: 0.9rem; }
  .tag { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
  .tag.open { background: var(--ok-bg); color: var(--ok-text); }
  .tag.closed { background: var(--surface-2); color: var(--text-2); }

  label { font-weight: 700; }
  .field, textarea.field, select.field {
    width: 100%; font: inherit; padding: 0.45rem 0.6rem; margin-top: 0.2rem;
    border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text);
  }
  textarea.field { min-height: 5rem; resize: vertical; }
  .block { margin: 0.8rem 0; }

  /* 문항 카드 */
  .q-card { margin: 0.8rem 0; padding: 0.8rem 0.9rem; border: 2px solid var(--line); border-radius: 14px; background: var(--surface-2); }
  .q-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .q-no { font-weight: 700; }
  .types { display: flex; flex-wrap: wrap; gap: 8px; margin: 0.5rem 0; }
  .type-opt { display: flex; align-items: center; gap: 0.3rem; padding: 0.3rem 0.7rem; border: 2px solid var(--line); border-radius: 999px; cursor: pointer; }
  .type-opt.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .opt-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0.35rem 0; }
  .opt-row .field { flex: 1 1 12rem; width: auto; margin-top: 0; }
  .opt-flags { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.85rem; font-weight: 400; }
  .opt-flags label { font-weight: 400; display: flex; align-items: center; gap: 0.25rem; }
  .max-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; }
  .max-row input { width: 5rem; }

  dialog.confirm {
    width: min(92vw, 28rem); padding: 0; border: 0; border-radius: 16px;
    background: var(--surface); color: var(--text); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  dialog.confirm::backdrop { background: rgba(0, 0, 0, 0.55); }
  dialog.confirm form { margin: 0; padding: 1.2rem; }
  dialog.confirm h2 { margin: 0 0 0.6rem; font-size: 1.25rem; }
  dialog.confirm p { margin: 0 0 1rem; white-space: pre-line; }
  .confirm-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
  .confirm-actions .btn { flex: 1 1 8rem; min-height: 52px; }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); }
</style>
<link rel="stylesheet" href="results.css">
</head>
<body>
<main id="main">
  <h1>설문 만들기</h1>
  <p class="sub">여기서 설문을 만들고, 링크를 나눠 주고, 결과를 봅니다.</p>
  <div id="app"><p>불러오는 중입니다…</p></div>
  <noscript><p>이 화면을 보려면 인터넷 브라우저에서 자바스크립트를 켜야 합니다.</p></noscript>
</main>

<dialog id="confirm" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="confirm-actions">
      <button type="submit" value="cancel" class="btn plain" id="confirm-cancel">취소</button>
      <button type="submit" value="ok" class="btn danger" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="questions.js"></script>
<script src="results.js"></script>
<script>
(function () {
  'use strict';

  // 설문 만들기 화면은 새 주소를 쓴다 (없으면 옛 주소)
  var ENDPOINT = String(window.SURVEY_ENDPOINT_NEW || window.SURVEY_ENDPOINT || '').trim();
  var app = document.getElementById('app');
  var state = { key: '', surveys: [], view: 'list', draft: null, editingId: '', busy: false, flash: null };
  var uid = 0;

  // ---------- 화면 조각
  function el(tag, props, children) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'text') node.textContent = v;
      else if (k === 'class') node.className = v;
      else if (k === 'hidden') node.hidden = true;
      else if (k.slice(0, 2) === 'on') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  function field(labelText, value, onInput, opts) {
    opts = opts || {};
    var id = 'f' + (++uid);
    var input = el(opts.multiline ? 'textarea' : 'input', { id: id, class: 'field', type: opts.type || 'text', rows: opts.rows });
    input.value = value == null ? '' : value;
    input.addEventListener('input', function () {
      if (state.draft) state.draft.dirty = true;
      onInput(input.value);
    });
    return el('div', { class: 'block' }, [
      el('label', { for: id, text: labelText }),
      opts.hint ? el('p', { class: 'hint', text: opts.hint }) : null,
      input
    ]);
  }

  function flash(text, ok) {
    state.flash = { text: text, ok: !!ok };
  }

  // ---------- 서버
  function readKey() {
    var m = location.hash.match(/key=([^&]+)/);
    if (!m) return '';
    try { return decodeURIComponent(m[1]).trim(); } catch (e) { return ''; }
  }

  function api(params, body) {
    var url = ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + params;
    var opts = { cache: 'no-store' };
    if (body) {
      opts.method = 'POST';
      opts.body = JSON.stringify(body);
      return fetch(ENDPOINT, opts).then(function (r) { return r.json(); });
    }
    return fetch(url, opts).then(function (r) { return r.json(); });
  }

  function loadList() {
    view = null;
    resultsFor = null;
    if (!ENDPOINT) {
      app.textContent = '';
      app.appendChild(el('p', { class: 'notice', text: '설정이 끝나지 않았습니다. config.js 에 구글 웹 앱 주소를 넣어야 합니다.' }));
      return;
    }
    state.key = readKey();
    if (!state.key) { showKeyForm(''); return; }
    app.textContent = '';
    app.appendChild(el('p', { text: '불러오는 중입니다…' }));
    api('key=' + encodeURIComponent(state.key) + '&list=1')
      .then(function (d) {
        if (!d || d.ok !== true) {
          if (d && d.error === 'key') { showKeyForm('비밀번호가 맞지 않습니다. 받으신 관리자 링크를 그대로 여셨는지 확인해 주세요.'); return; }
          throw new Error('bad');
        }
        state.surveys = d.surveys || [];
        state.view = 'list';
        render();
      })
      .catch(function () {
        app.textContent = '';
        app.appendChild(el('p', { class: 'notice', text: '설문 목록을 불러오지 못했습니다. 인터넷 연결을 확인하시고 다시 시도해 주세요.' }));
        app.appendChild(el('button', { type: 'button', class: 'btn primary', text: '다시 시도', onclick: loadList }));
      });
  }

  function showKeyForm(message) {
    app.textContent = '';
    var input = el('input', { type: 'text', id: 'key', class: 'field', autocomplete: 'off', spellcheck: 'false' });
    var form = el('form', { class: 'block' }, [
      el('label', { for: 'key', text: '관리자 비밀번호' }),
      input,
      el('div', { class: 'row', style: 'margin-top:8px' }, [el('button', { type: 'submit', class: 'btn primary', text: '열기' })])
    ]);
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var k = input.value.trim();
      if (!k) return;
      try { history.replaceState(null, '', '#key=' + encodeURIComponent(k)); } catch (e) { location.hash = 'key=' + encodeURIComponent(k); }
      loadList();
    });
    if (message) app.appendChild(el('p', { class: 'notice', text: message }));
    app.appendChild(form);
  }

  // 확인 창은 results.js 의 것을 같이 쓴다 (결과 화면과 같은 모양)
  var ask = window.SurveyConfirm;

  // ---------- 설문 링크
  function surveyLink(id) {
    var base = location.href.split('#')[0].split('?')[0].replace(/manage\.html$/, '');
    return base + '?id=' + encodeURIComponent(id);
  }

  function copyLink(id, btn) {
    var link = surveyLink(id);
    var done = function (okNow) {
      btn.textContent = okNow ? '복사했습니다' : '복사 안 됨';
      setTimeout(function () { btn.textContent = '설문 링크 복사'; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { done(true); }, function () { window.prompt('이 주소를 복사해 주세요', link); done(false); });
    } else {
      window.prompt('이 주소를 복사해 주세요', link);
      done(false);
    }
  }

  // ---------- 설문 목록 화면
  function renderList() {
    var nodes = [];
    nodes.push(el('div', { class: 'row' }, [
      el('button', { type: 'button', class: 'btn primary', text: '새 설문 만들기', onclick: function () { startNew(); } }),
      el('button', { type: 'button', class: 'btn plain', text: '새로 불러오기', onclick: loadList })
    ]));
    if (!state.surveys.length) {
      nodes.push(el('p', { class: 'hint', text: '아직 만든 설문이 없습니다. "새 설문 만들기" 를 눌러 시작하세요.' }));
    }
    state.surveys.forEach(function (s) {
      var linkBtn = el('button', { type: 'button', class: 'btn small plain', text: '설문 링크 복사' });
      linkBtn.addEventListener('click', function () { copyLink(s.id, linkBtn); });
      nodes.push(el('section', { class: 'card' }, [
        el('div', { class: 'q-head' }, [
          el('h2', { text: s.title }),
          el('span', { class: 'tag ' + (s.status === '열림' ? 'open' : 'closed'), text: s.status })
        ]),
        el('p', { class: 'meta', text: '문항 ' + s.questions + '개 · 응답 ' + s.responses + '명 · 고친 날짜 ' + (s.updated || '-') }),
        el('div', { class: 'row' }, [
          el('button', { type: 'button', class: 'btn small primary', text: '결과 보기', onclick: function () { openResults(s); } }),
          linkBtn,
          el('a', { class: 'btn small plain', href: surveyLink(s.id), target: '_blank', rel: 'noopener', text: '미리보기' }),
          el('button', { type: 'button', class: 'btn small plain', text: '고치기', onclick: function () { startEdit(s); } }),
          el('button', { type: 'button', class: 'btn small plain', text: '복사해서 새로 만들기', onclick: function () { startCopy(s); } }),
          el('button', {
            type: 'button', class: 'btn small plain', text: s.status === '열림' ? '마감하기' : '다시 열기',
            onclick: function () { setStatus(s, s.status === '열림' ? '마감' : '열림'); }
          }),
          el('button', { type: 'button', class: 'btn small danger-line', text: '지우기', onclick: function () { removeSurvey(s); } })
        ])
      ]));
    });
    return nodes;
  }

  // ---------- 편집기
  function blankQuestion() {
    return { uid: ++uid, title: '', type: 'one', options: ['', ''], help: '', max: 2, etcIndex: -1, noneIndex: -1 };
  }

  function toDraft(def) {
    return {
      id: def && def.id ? def.id : '',
      title: def ? def.title || '' : '',
      intro: def && def.intro ? def.intro.join('\n') : '',
      thanks: def ? def.thanks || '' : '',
      responses: 0,
      dirty: false,
      questions: (def && def.questions ? def.questions : [blankQuestion()]).map(function (q) {
        var options = (q.options || []).slice();
        return {
          uid: ++uid,
          id: q.id || '',
          title: q.title || '',
          help: q.help || '',
          type: q.type || 'one',
          max: q.max || 2,
          options: options.length ? options : ['', ''],
          etcIndex: q.etc ? options.indexOf(q.etc) : -1,
          noneIndex: q.none ? options.indexOf(q.none) : -1
        };
      })
    };
  }

  // 편집기 내용 -> 서버에 보낼 설문
  function fromDraft(d) {
    return {
      id: d.id || undefined,
      title: d.title,
      intro: d.intro.split('\n').map(function (t) { return t.trim(); }).filter(Boolean),
      thanks: d.thanks,
      questions: d.questions.map(function (q, i) {
        var out = { id: q.id || undefined, label: (i + 1) + '번', short: q.title.slice(0, 30), title: q.title, type: q.type, help: q.help };
        if (q.type === 'text') return out;
        var options = q.options.map(function (o) { return String(o).trim(); }).filter(Boolean);
        out.options = options;
        if (q.type === 'many') out.max = q.max;
        if (q.etcIndex >= 0 && q.options[q.etcIndex]) out.etc = String(q.options[q.etcIndex]).trim();
        if (q.type === 'many' && q.noneIndex >= 0 && q.options[q.noneIndex]) out.none = String(q.options[q.noneIndex]).trim();
        return out;
      })
    };
  }

  function startNew() {
    state.draft = toDraft(null);
    state.draft.questions = [blankQuestion()];
    state.editingId = '';
    state.view = 'edit';
    render();
  }

  function startEdit(s) {
    openForEdit(s, false);
  }
  function startCopy(s) {
    openForEdit(s, true);
  }

  function openForEdit(s, asCopy) {
    app.textContent = '';
    app.appendChild(el('p', { text: '설문을 불러오는 중입니다…' }));
    api('survey=' + encodeURIComponent(s.id))
      .then(function (d) {
        if (!d || d.ok !== true) throw new Error('bad');
        var def = d.survey;
        if (asCopy) {
          def.id = '';
          def.title = def.title + ' (복사본)';
          (def.questions || []).forEach(function (q) { delete q.id; });
        }
        state.draft = toDraft(def);
        state.editingId = asCopy ? '' : s.id;
        state.draft.id = asCopy ? '' : s.id;
        state.draft.responses = asCopy ? 0 : s.responses;
        state.view = 'edit';
        render();
      })
      .catch(function () {
        flash('설문을 불러오지 못했습니다. 다시 시도해 주세요.', false);
        loadList();
      });
  }

  function renderEdit() {
    var d = state.draft;
    var nodes = [];
    nodes.push(el('div', { class: 'row' }, [
      el('button', { type: 'button', class: 'btn plain', text: '← 목록으로', onclick: leaveEdit }),
      el('span', { class: 'hint', text: d.id ? '고치는 중' : '새 설문' })
    ]));

    if (d.id && d.responses > 0) {
      nodes.push(el('p', { class: 'notice' }, [
        '이 설문은 이미 ' + d.responses + '명이 답했습니다. 문항이나 선택지를 바꾸면 먼저 받은 답과 새 답이 섞여서 결과를 읽기 어려워집니다. ' +
        '내용을 바꾸실 거면 목록에서 "복사해서 새로 만들기" 를 쓰시는 편이 안전합니다.'
      ]));
    }

    nodes.push(field('설문 제목', d.title, function (v) { d.title = v; }));
    nodes.push(field('첫 화면 안내문', d.intro, function (v) { d.intro = v; }, { multiline: true, rows: '5', hint: '한 줄을 비우지 말고, 문단마다 줄을 바꿔 적으세요.' }));
    nodes.push(field('마지막 감사 문구', d.thanks, function (v) { d.thanks = v; }, { hint: '비워 두면 "설문에 참여해 주셔서 감사합니다." 가 쓰입니다.' }));

    nodes.push(el('h2', { text: '문항', style: 'margin-top:1.2rem' }));
    d.questions.forEach(function (q, i) { nodes.push(questionCard(q, i)); });

    nodes.push(el('div', { class: 'row' }, [
      el('button', { type: 'button', class: 'btn plain', text: '문항 추가', onclick: function () { d.questions.push(blankQuestion()); render(); } })
    ]));

    var saveBtn = el('button', { type: 'button', class: 'btn primary', text: '저장하기', onclick: function () { save(saveBtn, false); } });
    var previewBtn = el('button', { type: 'button', class: 'btn plain', text: '저장하고 미리보기', onclick: function () { save(previewBtn, true); } });
    nodes.push(el('div', { class: 'row end', style: 'margin-top:1.2rem' }, [
      el('button', { type: 'button', class: 'btn plain', text: '취소', onclick: leaveEdit }),
      previewBtn, saveBtn
    ]));
    return nodes;
  }

  function questionCard(q, i) {
    var d = state.draft;
    var move = function (delta) {
      var to = i + delta;
      if (to < 0 || to >= d.questions.length) return;
      var tmp = d.questions[i];
      d.questions[i] = d.questions[to];
      d.questions[to] = tmp;
      render();
    };
    var types = [['one', '하나만 고르기'], ['many', '여러 개 고르기'], ['text', '글로 적기']];
    var typeRow = el('div', { class: 'types' }, types.map(function (t) {
      var id = 'ty' + (++uid);
      var input = el('input', { type: 'radio', name: 'type' + q.uid, id: id, value: t[0] });
      input.checked = q.type === t[0];
      input.addEventListener('change', function () { if (input.checked) { q.type = t[0]; render(); } });
      return el('label', { class: 'type-opt' + (q.type === t[0] ? ' on' : ''), for: id }, [input, t[1]]);
    }));

    var body = [
      el('div', { class: 'q-head' }, [
        el('span', { class: 'q-no', text: (i + 1) + '번 문항' }),
        el('div', { class: 'row' }, [
          el('button', { type: 'button', class: 'btn small plain', 'aria-label': (i + 1) + '번 문항 위로', text: '▲', onclick: function () { move(-1); } }),
          el('button', { type: 'button', class: 'btn small plain', 'aria-label': (i + 1) + '번 문항 아래로', text: '▼', onclick: function () { move(1); } }),
          el('button', {
            type: 'button', class: 'btn small danger-line', 'aria-label': (i + 1) + '번 문항 지우기', text: '문항 지우기',
            onclick: function () {
              if (d.questions.length <= 1) { flash('문항이 하나는 있어야 합니다.', false); render(); return; }
              d.questions.splice(i, 1);
              render();
            }
          })
        ])
      ]),
      typeRow,
      field('질문 글', q.title, function (v) { q.title = v; }, { multiline: true, rows: '2' }),
      field('안내 글 (없으면 비워 두세요)', q.help, function (v) { q.help = v; })
    ];

    if (q.type !== 'text') {
      body.push(el('label', { text: '선택지' }));
      q.options.forEach(function (opt, k) {
        var input = el('input', { class: 'field', type: 'text' });
        input.value = opt;
        input.addEventListener('input', function () { state.draft.dirty = true; q.options[k] = input.value; });
        var etcBox = el('input', { type: 'checkbox', 'aria-label': (k + 1) + '번 선택지를 고르면 직접 적는 칸 열기' });
        etcBox.checked = q.etcIndex === k;
        etcBox.addEventListener('change', function () { q.etcIndex = etcBox.checked ? k : -1; render(); });
        var flags = [el('label', null, [etcBox, '직접 적는 칸'])];
        if (q.type === 'many') {
          var noneBox = el('input', { type: 'checkbox', 'aria-label': (k + 1) + '번 선택지는 혼자만 고르기' });
          noneBox.checked = q.noneIndex === k;
          noneBox.addEventListener('change', function () { q.noneIndex = noneBox.checked ? k : -1; render(); });
          flags.push(el('label', null, [noneBox, '혼자만 고르기']));
        }
        body.push(el('div', { class: 'opt-row' }, [
          input,
          el('div', { class: 'opt-flags' }, flags),
          el('button', {
            type: 'button', class: 'btn small plain', 'aria-label': (k + 1) + '번 선택지 지우기', text: '지우기',
            onclick: function () {
              q.options.splice(k, 1);
              if (q.etcIndex === k) q.etcIndex = -1; else if (q.etcIndex > k) q.etcIndex--;
              if (q.noneIndex === k) q.noneIndex = -1; else if (q.noneIndex > k) q.noneIndex--;
              render();
            }
          })
        ]));
      });
      body.push(el('div', { class: 'row' }, [
        el('button', { type: 'button', class: 'btn small plain', text: '선택지 추가', onclick: function () { q.options.push(''); render(); } })
      ]));
      if (q.type === 'many') {
        var maxInput = el('input', { class: 'field', type: 'number', min: '1', max: '30', 'aria-label': '최대 몇 개까지 고를 수 있는지' });
        maxInput.value = q.max;
        maxInput.addEventListener('input', function () { q.max = parseInt(maxInput.value, 10) || 1; });
        body.push(el('div', { class: 'max-row' }, [el('span', { text: '최대' }), maxInput, el('span', { text: '개까지 고르게 하기' })]));
      }
    }
    return el('section', { class: 'q-card' }, body);
  }

  function leaveEdit() {
    var go = function () {
      state.draft = null;
      state.editingId = '';
      loadList();
    };
    if (!state.draft || !state.draft.dirty) { go(); return; }
    ask('편집을 그만둘까요?', '저장하지 않은 내용은 사라집니다.', '그만두기', 0).then(function (yes) { if (yes) go(); });
  }

  function save(btn, preview) {
    if (state.busy) return;
    state.busy = true;
    btn.disabled = true;
    var oldText = btn.textContent;
    btn.textContent = '저장하는 중…';
    var payload = { action: 'saveSurvey', key: state.key, survey: fromDraft(state.draft) };
    api('', payload)
      .then(function (d) {
        state.busy = false;
        btn.disabled = false;
        btn.textContent = oldText;
        if (d && d.ok === true) {
          if (preview) window.open(surveyLink(d.id), '_blank', 'noopener');
          flash('저장했습니다.' + (preview ? ' 미리보기를 새 창에서 열었습니다.' : ''), true);
          state.draft = null;
          loadList();
          return;
        }
        if (d && d.error === 'invalid') { flash(d.detail || '설문 내용을 확인해 주세요.', false); render(); return; }
        if (d && d.error === 'toobig') { flash('설문이 너무 깁니다. 문항이나 글을 줄여 주세요.', false); render(); return; }
        if (d && d.error === 'key') { flash('비밀번호가 맞지 않습니다.', false); render(); return; }
        throw new Error('bad');
      })
      .catch(function () {
        state.busy = false;
        btn.disabled = false;
        btn.textContent = oldText;
        flash('저장하지 못했습니다. 인터넷 연결을 확인하시고 다시 눌러 주세요.', false);
        render();
      });
  }

  function setStatus(s, status) {
    api('', { action: 'setStatus', key: state.key, id: s.id, status: status })
      .then(function (d) {
        if (!d || d.ok !== true) throw new Error('bad');
        flash(status === '마감' ? '"' + s.title + '" 을 마감했습니다. 이제 답을 받지 않습니다.' : '"' + s.title + '" 을 다시 열었습니다.', true);
        loadList();
      })
      .catch(function () { flash('바꾸지 못했습니다. 다시 시도해 주세요.', false); render(); });
  }

  function removeSurvey(s) {
    ask('이 설문을 지울까요?', '"' + s.title + '"\n응답 ' + s.responses + '명', '지우기', 0)
      .then(function (yes) {
        if (!yes) return false;
        return ask('정말 지우시겠어요?', '지운 설문은 목록에서 사라지고, 그 설문 링크는 열리지 않습니다.\n받은 답은 구글 시트에 남습니다.', '완전히 지우기', 1000);
      })
      .then(function (yes) {
        if (!yes) return;
        return api('', { action: 'setStatus', key: state.key, id: s.id, status: '지움' }).then(function (d) {
          if (!d || d.ok !== true) throw new Error('bad');
          flash('"' + s.title + '" 을 지웠습니다.', true);
          loadList();
        });
      })
      .catch(function () { flash('지우지 못했습니다. 다시 시도해 주세요.', false); render(); });
  }

  // ---------- 설문별 결과 보기 (그리는 것은 results.js, 여기서는 불러오기만)
  var view = null;
  var resultsFor = null;   // 지금 보고 있는 설문 { id, title }

  function openResults(s) {
    app.textContent = '';
    app.appendChild(el('p', { text: '결과를 불러오는 중입니다…' }));
    state.view = 'results';
    resultsFor = s;
    api('survey=' + encodeURIComponent(s.id))
      .then(function (d) {
        if (!d || d.ok !== true) throw new Error('bad');
        var survey = window.SURVEY_MAKE(d.survey);
        app.textContent = '';
        view = window.SurveyResults({
          mount: app,
          survey: survey,
          ask: ask,
          onRefresh: function () { loadResults(); },
          fileName: '설문결과_' + (s.title || '설문'),
          header: function () {
            return el('div', { class: 'row', style: 'margin-bottom:8px' }, [
              el('button', { type: 'button', class: 'btn plain', text: '← 목록으로', onclick: function () { view = null; resultsFor = null; loadList(); } }),
              el('h2', { text: s.title })
            ]);
          },
          onDelete: function (r) {
            return api('', { action: 'delete', key: state.key, surveyId: s.id, id: r.id });
          }
        });
        loadResults();
      })
      .catch(function () {
        flash('결과를 불러오지 못했습니다. 다시 시도해 주세요.', false);
        loadList();
      });
  }

  function loadResults() {
    if (!view || !resultsFor) return;
    api('key=' + encodeURIComponent(state.key) + '&results=' + encodeURIComponent(resultsFor.id))
      .then(function (d) {
        if (!d || d.ok !== true) throw new Error('bad');
        view.setData(d.responses, d.broken, new Date());
      })
      .catch(function () {
        if (view.hasData()) view.showStale('방금 새로 불러오지 못했습니다 (' + view.nowClock() + '). 아래는 ' + view.loadedClock() + '에 불러온 결과입니다.');
        else { flash('결과를 불러오지 못했습니다. 다시 시도해 주세요.', false); loadList(); }
      });
  }

  // ---------- 그리기
  function render() {
    app.textContent = '';
    if (state.flash) {
      app.appendChild(el('p', { class: 'notice' + (state.flash.ok ? ' ok' : ''), role: 'status', text: state.flash.text }));
      state.flash = null;
    }
    var nodes = state.view === 'edit' && state.draft ? renderEdit() : renderList();
    nodes.forEach(function (n) { if (n) app.appendChild(n); });
  }

  window.addEventListener('hashchange', loadList);
  loadList();
})();
</script>
</body>
</html>
